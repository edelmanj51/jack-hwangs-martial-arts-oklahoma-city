REVIEWER_1_NAME: "Michael Peters"
REVIEWER_1_DATE: "9 years ago"
REVIEWER_1_TEXT: "The history of this school is awe-inspiring! Grand Master Hwang has been teaching in Oklahoma for 53 years. He teaches the traditional way of Taekwondo which is not as common these days. It is truly an honor to be his student!"

REVIEWER_2_NAME: "Cody Bratcher"
REVIEWER_2_DATE: "9 years ago"
REVIEWER_2_TEXT: "Two of my children attend this school and Grand Master Hwang's legacy is something they are proud to be a part of. This school has a wonderful learning atmosphere and very dedicated instructors."

REVIEWER_3_NAME: "Big Taink"
REVIEWER_3_DATE: "5 years ago"
REVIEWER_3_TEXT: "Me and my family are loving it. This school definitely takes pride in their work — step by step, very patient, and well worth adding to your daily schedule. Keep up the hard work!"

