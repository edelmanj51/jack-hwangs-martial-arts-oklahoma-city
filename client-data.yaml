ABOUT_TEXT: "Jack Hwang's Martial Arts has been training Oklahoma City students since 1964 — over 60 years of authentic Taekwondo instruction passed down through Grand Master Hwang's legendary lineage. Our goal is to enrich your life through martial arts training, developing students into excellent Black Belts who carry the values of courtesy, integrity, perseverance, self-control, and indomitable spirit into everything they do."

INSTRUCTOR_1_NAME: "Grand Master Randy McLean"
INSTRUCTOR_1_PHOTO: images/instructor/instructor-1.jpg
INSTRUCTOR_1_TITLE: "8th Dan Black Belt · Senior Instructor"
INSTRUCTOR_1_BIO: "Grand Master Randy McLean began training with Grand Master Hwang in February 1990 and has earned his 8th Dan Black Belt over more than three decades of dedicated practice. A former USAF Security Policeman and University of Oklahoma graduate, he brings discipline, structure, and deep technical knowledge to every class."

INSTRUCTOR_2_NAME: "Grand Master David McLennan"
INSTRUCTOR_2_PHOTO: images/instructor/instructor-2.jpg
INSTRUCTOR_2_TITLE: "9th Dan Black Belt · Senior Instructor"
INSTRUCTOR_2_BIO: "Grand Master David McLennan holds a 9th Degree Black Belt, placing him among the highest-ranked Taekwondo practitioners in the region. His decades of experience under Grand Master Hwang's lineage bring an unmatched depth of technical mastery and traditional values to our students."

INSTRUCTOR_3_NAME: "Master Tulio Ramirez"
INSTRUCTOR_3_PHOTO: images/instructor/instructor-3.jpg
INSTRUCTOR_3_TITLE: "5th Dan Black Belt · Instructor & School Manager"
INSTRUCTOR_3_BIO: "Master Tulio Ramirez is a 5th Degree Black Belt who serves as both Instructor and School Manager at Jack Hwang's Martial Arts. His passion for the art and commitment to student development make him a cornerstone of the day-to-day training experience for students of all levels."

PROGRAM_1_NAME: "Little Dragons"
PROGRAM_1_PHOTO: images/quick-tour/quick-tour-1.jpg
PROGRAM_1_AGE_RANGE: "Ages 4–6"
PROGRAM_1_DAYS: "Mon–Sat · Multiple class times"
PROGRAM_1_SESSION_LEN: "45-min classes"
PROGRAM_1_DESCRIPTION: "Little Dragons is our dedicated program for 4–6 year olds — designed to build focus, listening skills, and confidence through age-appropriate martial arts training. Young students learn respect, coordination, and self-control in a fun, structured environment. Parents consistently notice improvements in behavior and attention within weeks."
