PROGRAM_2_SESSION_LEN: "60-min classes"
PROGRAM_2_DESCRIPTION: "Our regular Taekwondo classes are open to students ages 7 and up — from complete beginners to experienced martial artists. You'll learn authentic traditional technique, real self-defense skills, and the discipline to earn every belt you wear. Our instructors meet you where you are and push you further than you thought possible."
